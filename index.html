<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <!-- Key sink: UXP only fires keydown on inputs, so this field takes focus on any press in the
         panel and gives the Enter-to-Go shortcut something to listen on (plugin.js initPanel). It must stay a
         real, focusable input (not hidden, read-only or tabindex -1, UXP refuses focus to those), so the
         zero-size wrapper clips it away instead: UXP draws its own focus ring otherwise. -->
    <div style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;">
      <input id="oc-key-sink" type="text" aria-hidden="true" autocomplete="off" spellcheck="false"
             style="position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:0;border:0;outline:none;background:transparent;color:transparent;caret-color:transparent;font-size:1px;">
    </div>
    <div class="main-row">

      <!-- Left column: graph toolbar + graph -->
      <div class="left-col">
        <!-- Graph toolbar: sits above the graph in its own row (zoom now, more tools later) -->
        <div id="graph-toolbar" class="graph-toolbar">
          <!-- Shown instead of every other tool once the bar is too narrow for them; opens a dropdown of all of them -->
          <div id="graph-tools-menu" class="tool-btn" style="display:none"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><line x1="1.5" y1="3" x2="10.5" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="1.5" y1="6" x2="10.5" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="1.5" y1="9" x2="10.5" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div id="peak-mode" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 10.5 C4 10.5 4.6 1.5 6 1.5 C7.4 1.5 8 10.5 11 10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
          <div id="add-point" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 11 C6.5 11 5.5 1 11 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><line x1="2.9" y1="0.8" x2="2.9" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="0.8" y1="2.9" x2="5" y2="2.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div id="flip-curve" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.6 3.4 1 6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 3.4 11 6 8.4 8.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div id="invert-curve" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2.2 9.8 9.8 2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6.2 2.2h3.6v3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.8 9.8H2.2V6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <!-- Drag ghost toggle: the curve's starting shape stays behind, faded, while a handle is dragged -->
          <div id="drag-ghost" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 8.5 C5 8.5 5.5 1.5 10 1.5" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M2 10.5 C6.5 10.5 6.5 3.5 11 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></div>
          <div class="graph-tools-right">
            <div id="zoom-out" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div id="zoom-in" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div id="graph-full" class="tool-btn"><svg class="ic-expand" width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1.5 4.5V1.5h3M7.5 1.5h3v3M10.5 7.5v3h-3M4.5 10.5h-3v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="ic-collapse" style="display:none" width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M4.5 1.5v3h-3M7.5 1.5v3h3M10.5 7.5h-3v3M1.5 7.5h3v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div id="graph-settings" class="tool-btn"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M10.18 5 L11.53 5.12 L11.53 6.88 L10.18 7 A4.3 4.3 0 0 1 9.67 8.25 L9.67 8.25 L10.53 9.29 L9.29 10.53 L8.25 9.67 A4.3 4.3 0 0 1 7 10.18 L7 10.18 L6.88 11.53 L5.12 11.53 L5 10.18 A4.3 4.3 0 0 1 3.75 9.67 L3.75 9.67 L2.71 10.53 L1.47 9.29 L2.33 8.25 A4.3 4.3 0 0 1 1.82 7 L1.82 7 L0.47 6.88 L0.47 5.12 L1.82 5 A4.3 4.3 0 0 1 2.33 3.75 L2.33 3.75 L1.47 2.71 L2.71 1.47 L3.75 2.33 A4.3 4.3 0 0 1 5 1.82 L5 1.82 L5.12 0.47 L6.88 0.47 L7 1.82 A4.3 4.3 0 0 1 8.25 2.33 L8.25 2.33 L9.29 1.47 L10.53 2.71 L9.67 3.75 A4.3 4.3 0 0 1 10.18 5 Z M8.3 6 A2.3 2.3 0 0 0 3.7 6 A2.3 2.3 0 0 0 8.3 6 Z" fill="currentColor" fill-rule="evenodd"/></svg></div>
          </div>
        </div>
        <div class="graph-section">
          <div class="graph-canvas-wrap">
            <svg id="bezier-svg" xmlns="http://www.w3.org/2000/svg">
              <rect id="sg-bg" x="0" y="0" width="100%" height="100%" fill="#111111"/>
              <g id="sg-content">
                <rect id="sg-range-bg" fill="#1c1c1c"/>
                <rect id="sg-range-outline" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                <g id="sg-grid" stroke-width="1"></g>
                <line id="sg-diag" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="3,4"/>
                <!-- Peak mode: the bezier itself, greyed and faded behind the velocity bell -->
                <path id="sg-ghost" fill="none" stroke="#9a9a9a" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0" visibility="hidden"/>
                <!-- Drag ghost: where the curve was when the drag started, in a faded theme colour until release (plugin.js _showDragGhost) -->
                <path id="sg-drag-ghost" fill="none" stroke="#4a9eff" stroke-opacity="0.28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0" visibility="hidden"/>
                <line id="sg-tan1" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
                <line id="sg-tan2" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
                <g id="sg-pts-lines"></g><!-- tangent lines of added points (plugin.js _updatePtsSVG) -->
                <path id="sg-curve" fill="none" stroke="#4a9eff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle id="sg-ep0" r="4" fill="#1e1e1e" stroke="#4a9eff" stroke-width="2"/>
                <circle id="sg-ep3" r="4" fill="#1e1e1e" stroke="#4a9eff" stroke-width="2"/>
                <g id="sg-h1">
                  <circle r="7" fill="rgba(74,158,255,0.12)"/>
                  <circle r="5" fill="#fff" stroke="#fff" stroke-width="1.5"/>
                </g>
                <g id="sg-h2">
                  <circle r="7" fill="rgba(74,158,255,0.12)"/>
                  <circle r="5" fill="#fff" stroke="#fff" stroke-width="1.5"/>
                </g>
                <g id="sg-pts"></g><!-- handles and anchors of added points -->
                <g id="sg-peak" opacity="0" visibility="hidden">
                  <circle r="7" fill="rgba(74,158,255,0.12)"/>
                  <circle r="5" fill="#fff" stroke="#fff" stroke-width="1.5"/>
                </g>
              </g>
            </svg>
            <div id="graph-coords" class="graph-coords"></div>
          </div>
        </div>
      </div>

      <!-- Resize handle -->
      <div id="resize-handle" class="resize-handle"></div>

      <!-- Right column: presets -->
      <div id="right-col" class="right-col">
        <div class="controls-panel">
          <div id="all-presets-list"></div>
        </div>
      </div>

    </div>
    <!-- Timeline row: the property rows sit at the right (their own width, dragged at #tl-prop-handle,
         independent of the preset column above) and each row's lane runs leftwards across the strip at
         the row's 32px height, so a lane reads as part of its property button (_tlRender). Right-clicking
         the lanes opens the clip/keyframe zoom toggle and Open Settings. With the timeline off (Settings)
         only the rows remain and take the full width. What's under the pointer shows in the status strip.
         #tl-resize above it drags the area's height (double-press = fit the rows again); lanes and rows
         then scroll together inside #tl-scroll, so a clip with more properties never pushes the graph
         and presets around. -->
    <div id="tl-resize" class="tl-resize-handle"></div>
    <div id="oc-timeline" class="oc-timeline">
      <div id="tl-scroll" class="tl-scroll">
        <div class="tl-scroll-inner">
          <div class="tl-canvas-wrap">
            <svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="tl-empty" class="tl-empty"></div>
          </div>
          <div id="tl-prop-handle" class="resize-handle"></div>
          <div id="prop-btns" class="prop-btns"></div>
        </div>
      </div>
      <!-- Fades along the top and bottom edges while there is more to scroll to that way
           (_tlUpdateFade). Stacked translucent bands rather than a gradient, which UXP can't be
           relied on to draw. -->
      <div id="tl-fade-top" class="tl-fade tl-fade-top"><div style="background:rgba(17,17,17,0.86)"></div><div style="background:rgba(17,17,17,0.72)"></div><div style="background:rgba(17,17,17,0.58)"></div><div style="background:rgba(17,17,17,0.45)"></div><div style="background:rgba(17,17,17,0.32)"></div><div style="background:rgba(17,17,17,0.21)"></div><div style="background:rgba(17,17,17,0.12)"></div><div style="background:rgba(17,17,17,0.05)"></div></div>
      <div id="tl-fade" class="tl-fade"><div style="background:rgba(17,17,17,0.05)"></div><div style="background:rgba(17,17,17,0.12)"></div><div style="background:rgba(17,17,17,0.21)"></div><div style="background:rgba(17,17,17,0.32)"></div><div style="background:rgba(17,17,17,0.45)"></div><div style="background:rgba(17,17,17,0.58)"></div><div style="background:rgba(17,17,17,0.72)"></div><div style="background:rgba(17,17,17,0.86)"></div></div>
    </div>
    <!-- Bottom row: status strip + Go (with its floating Undo), the very bottom of the panel under the
         mini timeline, in both layouts (graph on or off). Go is kept as wide as the property column
         (_tlSetGoWidth), so it sits under the rows and the strip runs under the lanes. -->
    <div id="oc-bottom-row" class="oc-bottom-row">
      <div id="status-strip" class="status-strip status-idle">
        <span class="status-dot"><svg width="10" height="10" viewBox="-1 -1 10 10" fill="none"><polygon class="mk-diamond" points="4,0.9 7.1,4 4,7.1 0.9,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="mk-tick" d="M0.7 4.4 L3.1 6.8 L7.4 1.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0" visibility="hidden"/></svg></span>
        <span id="status-clip" class="status-clip" style="display:none"></span>
        <span id="status-text" class="status-text">Select a clip</span>
      </div>
      <!-- Continues the lanes/rows drag handle down between the strip and Go (not draggable itself) -->
      <div class="bottom-divider"></div>
      <div class="go-row">
        <div id="go-btn" class="btn btn-primary btn-disabled">
          <svg id="go-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L4.5 13.5H12L11 22L19.5 10.5H12L13 2Z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="go-label" style="margin-left:5px;font-size:13px;font-weight:600;">Go</span>
          <span id="go-spinner" class="spinner" style="display:none"></span>
        </div>
        <!-- Undo the last Go press (same control as the CEP edition). Dimmed by plugin.js until there is a bake to undo. -->
        <div id="undo-btn" class="btn btn-undo btn-dim">
          <!-- Same icon as the row undo buttons (.prop-undo) -->
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3.8 5.5H8.6a2.9 2.9 0 010 5.8H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.8 3.3L3.5 5.5l2.3 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      console.error('[FS] Uncaught error:', msg, 'at', src + ':' + line, err);
    };
    window.onunhandledrejection = function(e) {
      console.error('[FS] Unhandled rejection:', e.reason);
    };
    console.log('[FS] HTML loaded, about to load plugin.js');
  </script>
  <script src="src/plugin.js"></script>
</body>
</html>
